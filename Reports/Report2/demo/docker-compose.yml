services:
  db:
    image: postgres:15
    container_name: biua_postgres
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: biua_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ./data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: biua_keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # URL público usado pelo browser e pelo issuer dos tokens
      KC_HOSTNAME: http://localhost:8081

      # Permite chamadas internas Docker como http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  superset:
    build:
      context: .
      dockerfile: Dockerfile
    image: biua_superset_oauth:latest
    container_name: biua_superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      - db
      - keycloak
    volumes:
      - superset_home:/app/superset_home
      - ./init.sh:/app/init.sh
      - ./superset_config.py:/app/pythonpath/superset_config.py
      - ./branding:/app/branding:ro
    command: ["/bin/sh", "-c", "/app/init.sh"]

volumes:
  postgres_data:
  superset_home:
  keycloak_data: